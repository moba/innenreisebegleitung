# baseURL, es gibt dafür keinen eigenen Schalter.

baseURL = "https://www.innenreisebegleitung.de/"

[params]
  # Wird im Inhalt über {{< email >}} eingesetzt, siehe content/kontakt.md.
  email = "moritz@innenreisebegleitung.de"
